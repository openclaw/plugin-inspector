name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-sdk-entrypoints:
    name: Windows SDK entrypoints
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check SDK entrypoints and referenced host types
        run: node --test test/sdk-usage-runtime-entrypoints.test.js test/sdk-usage-host.test.js

      - name: Setup Node for profile diagnostics
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check bounded profile failure diagnostics
        timeout-minutes: 2
        run: node --test test/profile-failure-output.test.js

  check:
    name: Node 22
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check
        run: npm run check

      - name: Check retained runtime import behavior
        run: |
          git rev-parse HEAD
          git ls-files -s src/runtime-imports.js src/sdk-mock.js test/fixtures/runtime-import-behavior.mjs
          node test/fixtures/runtime-import-behavior.mjs src/sdk-mock.js

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Check runtime imports with Bun
        run: bun test test/runtime-imports.test.js
