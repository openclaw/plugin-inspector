version: 2.1

jobs:
  plugin-inspector:
    docker:
      - image: cimg/node:24.22.1@sha256:af46387c805de6dc3bc101a66de590daf4d01d5565ea66a99cf438fba323a055
    steps:
      - checkout
      - run: npm ci
      - run: npx @openclaw/plugin-inspector ci --no-openclaw --runtime --mock-sdk --allow-execute
      - store_test_results:
          path: reports
      - store_artifacts:
          path: reports

workflows:
  plugin-inspector:
    jobs:
      - plugin-inspector
